syntax = "proto3";

import "google/protobuf/empty.proto";

service ProductService {
    rpc GetProducts(google.protobuf.Empty) returns (ProductList);
}


message ProductRequest{
}

message Dimmension{
    int32 height = 1;
    int32 length = 2;
    int32 width = 3;
}

message Product{
    int32 id = 1;
    int32 category = 2;
    int32 price = 3;
    string spec = 4;
    string details = 5;
    Dimmension dimmension = 6;
}

message ProductList {
    repeated Product products = 1;
}
